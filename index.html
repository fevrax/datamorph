<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Datamorph - 数据处理工作台</title>
    <meta content="Datamorph - 数据处理工作台" property="og:title" />
    <meta
      content="一源万构，形随需变。自动识别 JSON、YAML、TOML、XML 等主流数据格式，随需编辑与转换。"
      property="og:description"
    />
    <meta
      content="一源万构，形随需变。自动识别 JSON、YAML、TOML、XML 等主流数据格式，随需编辑与转换。"
      name="description"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Datamorph" />
    <meta name="application-name" content="Datamorph" />
    <meta name="theme-color" content="#f4f4f5" />
    <script>
      (() => {
        const lightThemeColor = "#f4f4f5";
        const darkThemeColor = "#27272a";

        try {
          const savedTheme = localStorage.getItem("theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const isDark =
            savedTheme === "dark" || (savedTheme === "system" && prefersDark);

          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute(
              "content",
              isDark ? darkThemeColor : lightThemeColor,
            );
          document
            .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
            ?.setAttribute("content", isDark ? "black" : "default");
        } catch {
          // localStorage 受限时保留浅色回退值。
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
